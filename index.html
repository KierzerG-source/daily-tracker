<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=Chivo+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12161d;
    --panel: #1a2029;
    --panel-2: #212936;
    --line: #2d3748;
    --text: #e9edf3;
    --muted: #94a0b2;
    --go: #5fd0a5;
    --warn: #f2b64b;
    --over: #ff6b6b;
    --btn: #3a4a63;
    --sans: "Chivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --num: "Chivo Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--sans); }
  body { min-height: 100vh; line-height: 1.45; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 64px; }

  /* Clock */
  .clock { padding: 18px 0 22px; border-bottom: 1px solid var(--line); }
  .site-name { font-weight: 800; font-size: 20px; margin-bottom: 10px; }
  .clock-time { font-family: var(--num); font-weight: 700; font-size: clamp(44px, 12vw, 84px); letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .clock-time small { font-size: 0.35em; margin-left: 8px; color: var(--muted); font-weight: 500; }
  .clock-date { margin-top: 8px; color: var(--muted); }
  .settings { display: flex; flex-wrap: wrap; gap: 14px 22px; margin-top: 16px; align-items: center; }
  .settings label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  input, select { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font: inherit; font-size: 15px; }
  input[type=number] { width: 78px; font-family: var(--num); }

  /* Active banner */
  .now { margin: 18px 0 8px; padding: 14px 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 68px; }
  .now.running { border-color: var(--go); }
  .now.over { border-color: var(--over); }
  .now-name { font-weight: 800; font-size: 18px; }
  .now-sub { color: var(--muted); font-size: 14px; }
  .now-time { font-family: var(--num); font-weight: 700; font-size: 34px; font-variant-numeric: tabular-nums; }

  /* Status rows */
  .row { margin-top: 10px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; }
  .row.active { border-color: var(--go); background: var(--panel-2); }
  .row.over { border-color: var(--over); }
  .row-name { font-weight: 800; font-size: 17px; }
  .row-rule { color: var(--muted); font-size: 13.5px; grid-column: 1; }
  .row-left { font-family: var(--num); font-weight: 700; font-size: 26px; text-align: right; font-variant-numeric: tabular-nums; }
  .row-left.warn { color: var(--warn); }
  .row-left.over { color: var(--over); }
  .bar { grid-column: 1 / -1; height: 6px; background: var(--ink); border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--go); transition: width .25s linear; }
  .bar > i.warn { background: var(--warn); }
  .bar > i.over { background: var(--over); }
  .row-foot { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .used { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 7px; padding: 9px 18px; color: #fff; background: var(--btn); min-width: 96px; }
  button:hover { filter: brightness(1.15); }
  button.start { background: #2f7f66; }
  button.stop { background: #a8403f; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); font-weight: 400; min-width: 0; padding: 7px 12px; }
  :focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }

  /* Log */
  h2 { font-size: 16px; margin: 34px 0 8px; font-weight: 800; }
  .log { list-style: none; margin: 0; padding: 0; font-size: 14px; }
  .log li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .log .empty { color: var(--muted); border: 0; }
  .bottom { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--muted); font-size: 13px; }

  @media (max-width: 480px) {
    .row { grid-template-columns: 1fr; }
    .row-left { text-align: left; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }
</style>
</head>
<body>
<div class="wrap">

  <header class="clock">
    <div class="site-name">Daily Tracker</div>
    <div class="clock-time" id="clock">--:--:--<small id="ampm"></small></div>
    <div class="clock-date" id="date"></div>
    <div class="settings">
      <label>Hours in your shift
        <input type="number" id="hours" min="1" max="24" step="0.5" value="8">
      </label>
      <label>Lunch
        <select id="lunchLen">
          <option value="30">30 min</option>
          <option value="60">1 hour</option>
        </select>
      </label>
    </div>
  </header>

  <section class="now" id="now" aria-live="polite">
    <div>
      <div class="now-name" id="nowName">Not on a status</div>
      <div class="now-sub" id="nowSub">Pick a status below to start its timer.</div>
    </div>
    <div class="now-time" id="nowTime">0:00</div>
  </section>

  <main id="rows"></main>

  <h2>Today's log</h2>
  <ul class="log" id="log"></ul>

  <div class="bottom">
    <button class="ghost" id="reset">Reset today</button>
    <span class="note">Everything resets automatically at 12:00 AM Eastern. Data stays in this browser only.</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TZ = "America/New_York";
  var STORE = "break-tracker-v1";
  var MIN = 60;

  /* ---------- Rules (edit these if your guidelines change) ---------- */
  function otherBreakCount(h) { return h < 4 ? 1 : h < 6 ? 2 : h < 10 ? 3 : h < 14 ? 4 : h < 16 ? 5 : 6; }
  function restroomMins(h)    { return h < 5 ? 10 : h < 9 ? 20 : h < 13 ? 30 : 40; }

  // mode "pool"   = one allowance for the whole day
  // mode "perUse" = limit applies to each time you use the status
  var STATUSES = [
    { id: "other", name: "Other Break", mode: "pool",
      limit: function (s) { return otherBreakCount(s.hours) * 15 * MIN; },
      rule:  function (s) { var n = otherBreakCount(s.hours); return n + " × 15 min break" + (n > 1 ? "s" : "") + " for " + s.hours + "h worked"; } },
    { id: "restroom", name: "Restroom", mode: "pool",
      limit: function (s) { return restroomMins(s.hours) * MIN; },
      rule:  function (s) { return restroomMins(s.hours) + " min total for " + s.hours + "h worked"; } },
    { id: "tech", name: "Technical Issue", mode: "pool",
      limit: function () { return 15 * MIN; },
      rule:  function () { return "15 min for a regular shift"; } },
    { id: "moretime", name: "Need More Time", mode: "pool",
      limit: function () { return 20 * MIN; },
      rule:  function () { return "20 min for a regular shift"; } },
    { id: "callback", name: "Call Back", mode: "perUse",
      limit: function () { return 5 * MIN; },
      rule:  function () { return "Max 5 min difference between the actual call back and when you went on this status (each time)"; } },
    { id: "loli", name: "LOLI", mode: "pool",
      limit: function () { return 5 * MIN; },
      rule:  function () { return "5 min per regular 8h shift, or when Eng advises it for updates"; } },
    { id: "lunch", name: "Lunch", mode: "pool",
      limit: function (s) { return s.lunchMin * MIN; },
      rule:  function (s) { return s.lunchMin + " min, approved by a team lead (make up the time before or after shift)"; } }
  ];

  /* ---------- Time helpers ---------- */
  var timeFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
  var longDateFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric", year: "numeric" });
  var keyFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  var shortFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit", second: "2-digit", hour12: true });
  var zoneFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, timeZoneName: "short" });

  function etKey(ms) { return keyFmt.format(ms); }
  function zoneName(ms) {
    var p = zoneFmt.formatToParts(ms);
    for (var i = 0; i < p.length; i++) if (p[i].type === "timeZoneName") return p[i].value;
    return "ET";
  }
  function mmss(sec) {
    sec = Math.max(0, Math.floor(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var ss = (s < 10 ? "0" : "") + s;
    if (h > 0) return h + ":" + (m < 10 ? "0" : "") + m + ":" + ss;
    return m + ":" + ss;
  }

  /* ---------- State ---------- */
  function fresh(prev) {
    return {
      date: etKey(Date.now()),
      hours: prev ? prev.hours : 8,
      lunchMin: prev ? prev.lunchMin : 30,
      used: {},        // seconds completed per status id
      active: null,    // { id, start }
      log: []          // { id, start, end }
    };
  }
  var state;
  try { state = JSON.parse(localStorage.getItem(STORE)); } catch (e) { state = null; }
  if (!state || typeof state !== "object" || !state.used) state = fresh(null);
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  function byId(id) { for (var i = 0; i < STATUSES.length; i++) if (STATUSES[i].id === id) return STATUSES[i]; }
  function elapsed(id) { return state.active && state.active.id === id ? (Date.now() - state.active.start) / 1000 : 0; }
  function usedTotal(id) { return (state.used[id] || 0) + elapsed(id); }

  function stopActive() {
    if (!state.active) return;
    var a = state.active, end = Date.now();
    state.used[a.id] = (state.used[a.id] || 0) + (end - a.start) / 1000;
    state.log.push({ id: a.id, start: a.start, end: end });
    state.active = null;
  }
  function startStatus(id) {
    var wasThis = state.active && state.active.id === id;
    stopActive();
    if (!wasThis) { state.active = { id: id, start: Date.now() }; primeAudio(); }
    alerted = {};
    save(); renderLog(); tick();
  }

  /* ---------- Sound (one short beep when a limit is reached) ---------- */
  var actx = null, alerted = {};
  function primeAudio() {
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
  }
  function beep() {
    if (!actx) return;
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; g.gain.value = 0.08;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.35);
    } catch (e) {}
  }

  /* ---------- Build DOM ---------- */
  var rowsEl = document.getElementById("rows");
  var refs = {};
  STATUSES.forEach(function (st) {
    var row = document.createElement("section");
    row.className = "row";
    row.innerHTML =
      '<div><div class="row-name"></div></div>' +
      '<div class="row-left">0:00</div>' +
      '<div class="row-rule"></div>' +
      '<div class="bar"><i></i></div>' +
      '<div class="row-foot"><span class="used"></span><button type="button" class="start">Start</button></div>';
    row.querySelector(".row-name").textContent = st.name;
    row.querySelector("button").addEventListener("click", function () { startStatus(st.id); });
    rowsEl.appendChild(row);
    refs[st.id] = {
      row: row,
      rule: row.querySelector(".row-rule"),
      left: row.querySelector(".row-left"),
      bar: row.querySelector(".bar > i"),
      used: row.querySelector(".used"),
      btn: row.querySelector("button")
    };
  });

  var $clock = document.getElementById("clock"), $date = document.getElementById("date");
  var $now = document.getElementById("now"), $nowName = document.getElementById("nowName");
  var $nowSub = document.getElementById("nowSub"), $nowTime = document.getElementById("nowTime");
  var $hours = document.getElementById("hours"), $lunch = document.getElementById("lunchLen");
  $hours.value = state.hours; $lunch.value = String(state.lunchMin);

  $hours.addEventListener("input", function () {
    var v = parseFloat($hours.value);
    if (isFinite(v) && v > 0 && v <= 24) { state.hours = v; save(); tick(); }
  });
  $lunch.addEventListener("change", function () { state.lunchMin = parseInt($lunch.value, 10); save(); tick(); });
  document.getElementById("reset").addEventListener("click", function () {
    if (confirm("Clear all of today's timers and log?")) { state = fresh(state); alerted = {}; save(); renderLog(); tick(); }
  });

  /* ---------- Render ---------- */
  function renderLog() {
    var ul = document.getElementById("log");
    ul.innerHTML = "";
    if (!state.log.length) {
      var li = document.createElement("li"); li.className = "empty"; li.textContent = "Nothing logged yet today."; ul.appendChild(li); return;
    }
    state.log.slice().reverse().forEach(function (e) {
      var li = document.createElement("li");
      var l = document.createElement("span"), r = document.createElement("span");
      l.textContent = byId(e.id).name + "  (" + shortFmt.format(e.start) + " to " + shortFmt.format(e.end) + ")";
      r.textContent = mmss((e.end - e.start) / 1000);
      li.appendChild(l); li.appendChild(r); ul.appendChild(li);
    });
  }

  function tick() {
    var now = Date.now();

    // Daily reset at midnight Eastern
    if (etKey(now) !== state.date) {
      state = fresh(state); alerted = {}; save(); renderLog();
    }

    // Clock
    var parts = timeFmt.formatToParts(now), t = "", ap = "";
    parts.forEach(function (p) {
      if (p.type === "dayPeriod") ap = p.value; else if (p.type !== "literal" || t) t += p.value;
    });
    t = t.trim();
    $clock.firstChild.nodeValue = t;
    document.getElementById("ampm").textContent = ap + " " + zoneName(now);
    $date.textContent = longDateFmt.format(now);

    var activeInfo = null;

    STATUSES.forEach(function (st) {
      var r = refs[st.id];
      var limit = st.limit(state);
      var isActive = state.active && state.active.id === st.id;
      var shown, usedForBar;

      if (st.mode === "perUse") {
        // Limit applies to the current use only
        var cur = elapsed(st.id);
        usedForBar = cur;
        shown = limit - cur;
        r.left.textContent = isActive ? (shown >= 0 ? mmss(shown) : "+" + mmss(-shown)) : mmss(limit);
        r.used.textContent = "Total today: " + mmss(usedTotal(st.id));
      } else {
        usedForBar = usedTotal(st.id);
        shown = limit - usedForBar;
        r.left.textContent = shown >= 0 ? mmss(shown) : "+" + mmss(-shown);
        r.used.textContent = "Used " + mmss(usedForBar) + " of " + mmss(limit);
      }

      var over = isActive || st.mode === "pool" ? shown < 0 : false;
      var low = shown >= 0 && shown <= 60 && (isActive || st.mode === "pool") && usedForBar > 0;
      r.rule.textContent = st.rule(state);
      r.row.className = "row" + (isActive ? " active" : "") + (over ? " over" : "");
      r.left.className = "row-left" + (over ? " over" : low ? " warn" : "");
      var pct = Math.min(100, Math.max(0, (usedForBar / limit) * 100));
      r.bar.style.width = pct + "%";
      r.bar.className = over ? "over" : (pct >= 80 ? "warn" : "");
      r.btn.textContent = isActive ? "Stop" : "Start";
      r.btn.className = isActive ? "stop" : "start";

      if (isActive) {
        activeInfo = { st: st, shown: shown, over: over };
        if (shown <= 0 && !alerted[st.id]) { alerted[st.id] = true; beep(); }
      }
    });

    // Banner + tab title
    if (activeInfo) {
      var a = activeInfo;
      $now.className = "now running" + (a.over ? " over" : "");
      $nowName.textContent = a.st.name;
      $nowSub.textContent = a.over ? "Over your limit" : (a.st.mode === "perUse" ? "Time left on this call back" : "Time left today");
      $nowTime.textContent = a.over ? "+" + mmss(-a.shown) : mmss(a.shown);
      document.title = (a.over ? "+" + mmss(-a.shown) : mmss(a.shown)) + " · " + a.st.name;
    } else {
      $now.className = "now";
      $nowName.textContent = "Not on a status";
      $nowSub.textContent = "Pick a status below to start its timer.";
      $nowTime.textContent = "0:00";
      document.title = "Daily Tracker";
    }
  }

  renderLog();
  tick();
  setInterval(tick, 250);
  document.addEventListener("visibilitychange", tick);
})();
</script>
</body>
</html>
